name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build et tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # La version du SDK vient de global.json : une seule source de vérité entre le poste
      # de développement et la CI.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Sans ça, la cible MSBuild BuildWebUi (HomelabHub.Host.csproj) ne trouve pas npm en
      # configuration Release et le build .NET échoue sur un exécutable introuvable — un signal
      # opaque pour ce qui est en réalité un front cassé. La version vient de .node-version, même
      # source de vérité que le poste de développement (voir docs sur fnm).
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: "web-ui/package-lock.json"

      - name: Restauration
        run: dotnet restore

      # En Release, la cible MSBuild BuildWebUi construit web-ui/ (npm ci && npm run build,
      # qui lance tsc --noEmit avant vite build) avant même de compiler le premier projet .NET :
      # un front cassé — erreurs de type comprises — fait donc échouer cette étape, pas une
      # découverte au premier déploiement sur le LXC.
      - name: Build
        run: dotnet build --no-restore -c Release

      # Inclut le test d'architecture (ADR-0010) : si un module gagne une référence vers le
      # noyau, la CI casse. C'est le seul moyen de faire tenir une frontière dans le temps.
      - name: Tests
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"
